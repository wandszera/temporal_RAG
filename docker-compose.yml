services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: temporal_rag_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal_pass}
      POSTGRES_DB: ${POSTGRES_DB:-temporal_crm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal_user} -d ${POSTGRES_DB:-temporal_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
