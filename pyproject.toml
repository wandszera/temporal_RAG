[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-rag"
version = "0.1.0"
description = "Temporal RAG para CRM com modelagem bitemporal e benchmark de avaliação"
readme = "README.md"
authors = [{ name = "Temporal RAG Team" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "tabulate>=0.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.0",
    "langgraph>=1.2.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
